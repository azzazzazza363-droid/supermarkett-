<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوبرماركت الحي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d1b16;--mu:#7b766a;--ac:#10a15f;--ac2:#0b7a48;--bd:#e8e3d6;--bad:#d64545;--sh:0 6px 18px rgba(40,30,10,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12110f;--card:#1f1e1a;--tx:#f3f0e8;--mu:#a29d90;--ac:#2fd08a;--ac2:#1fa86c;--bd:#33312b;--bad:#ff7b7b;--sh:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#12110f;--card:#1f1e1a;--tx:#f3f0e8;--mu:#a29d90;--ac:#2fd08a;--ac2:#1fa86c;--bd:#33312b;--bad:#ff7b7b;--sh:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
.w{max-width:520px;margin:0 auto;padding:0 14px 110px;animation:f .35s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{margin:0 -14px 18px;padding:34px 20px 40px;background:linear-gradient(135deg,#10a15f,#0b6b9e);color:#fff;border-radius:0 0 32px 32px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:28px;font-weight:800}.hero p{margin:4px 0 0;opacity:.9;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border:0;border-radius:22px;padding:18px 10px;color:#fff;font:inherit;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s;min-height:128px;justify-content:center}
.cat:active{transform:scale(.95)}.cat .e{font-size:44px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}.cat small{font-weight:600;opacity:.9;font-size:12px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top h2{margin:0;font-size:20px;flex:1}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--sh);font-size:20px;cursor:pointer;color:var(--tx)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.row .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff}
.row .n{flex:1;font-weight:600}.row .p{color:var(--ac);font-weight:800;font-size:14px}
.q{display:flex;align-items:center;gap:8px}.q b{min-width:20px;text-align:center}
.q button{width:36px;height:36px;border-radius:12px;border:0;font-size:20px;font-weight:800;cursor:pointer;background:var(--bd);color:var(--tx)}
.q button.pl{background:var(--ac);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:9}
.bar button,.main{width:100%;max-width:492px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:18px;padding:15px 18px;font:inherit;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px rgba(16,161,95,.4);cursor:pointer}
.main{justify-content:center;max-width:none;margin-top:12px}.main:disabled{opacity:.4}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:16px 0 12px}
.lock{display:block;margin:26px auto 0;background:none;border:0;font-size:18px;opacity:.35;cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:20px auto}
.pad button{height:64px;border-radius:20px;border:0;background:var(--card);box-shadow:var(--sh);font:inherit;font-size:24px;font-weight:800;color:var(--tx);cursor:pointer}
.pad button:active{background:var(--ac);color:#fff}
.dots{display:flex;justify-content:center;gap:12px;height:20px;margin-top:24px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--bd)}.dots i.f{background:var(--ac)}
.shake{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sw{width:50px;height:30px;border-radius:15px;background:var(--bd);position:relative;border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{right:23px}
.dl{color:var(--bad);background:none;border:0;font-size:18px;cursor:pointer}
.ch{font-weight:800;margin:18px 0 8px;color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin:10px 0}
.off{opacity:.5}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}button:active{transform:scale(.96)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:20px}.bx{background:var(--card);border-radius:22px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:var(--sh);animation:f .2s ease}.bx p{margin:0 0 18px;font-weight:800;font-size:18px}.yn{display:flex;gap:10px}.yn button{flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.y{background:var(--ac);color:#fff}.y.r{background:var(--bad)}.no{background:var(--bd);color:var(--tx)}
.vis{border:0;border-radius:12px;padding:8px 12px;font:inherit;font-weight:800;font-size:14px;background:var(--bd);color:var(--mu);cursor:pointer;flex:none}
.vis.on{background:var(--ac);color:#fff}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div class="bar" id="bar"></div>
<script>
var WA="963949600493"; // رقم واتساب صاحب المحل (غيّره)
var API="https://script.google.com/macros/s/AKfycbzT-1uRLoGkC5BRhsLAU5jBvda9svgeoWWoxFvKfyW3-JP_ucpBkLj6_HJv400n13Ln5w/exec"; // رابط Google Apps Script
var PLEN=5, adminPass="";
var CATS=[
{id:"g",n:"الحبوب والبقوليات",e:"🌾",c:"#e9a62b,#d9731a"},
{id:"b",n:"البسكويت",e:"🍪",c:"#c9824a,#9a5a2b"},
{id:"c",n:"الشيبس",e:"🥔",c:"#f2c230,#e8952a"},
{id:"d",n:"المنظفات",e:"🧼",c:"#35b6e8,#2a78d6"},
{id:"m",n:"المشروبات",e:"🥤",c:"#ef5a5a,#c93a6a"},
{id:"a",n:"الألبان والأجبان",e:"🧀",c:"#a98bf0,#6b57d6"}];
var items=[
{id:1,cat:"g",name:"أرز مصري 1 كغ",price:14000,on:true},{id:2,cat:"g",name:"عدس أحمر 1 كغ",price:12000,on:true},{id:3,cat:"g",name:"حمص حب 1 كغ",price:16000,on:true},
{id:4,cat:"b",name:"بسكويت شاي",price:3000,on:true},{id:5,cat:"b",name:"بسكويت شوكولا",price:5000,on:true},{id:6,cat:"b",name:"كراكرز",price:4000,on:false},
{id:7,cat:"c",name:"شيبس ملح",price:5000,on:true},{id:8,cat:"c",name:"شيبس كاتشب",price:5000,on:true},{id:9,cat:"c",name:"بوشار",price:3500,on:true},
{id:10,cat:"d",name:"سائل جلي",price:11000,on:true},{id:11,cat:"d",name:"مسحوق غسيل 3 كغ",price:48000,on:true},{id:12,cat:"d",name:"معطر أرضيات",price:15000,on:true},
{id:13,cat:"m",name:"مي (طرد)",price:15000,on:true},{id:14,cat:"m",name:"كولا",price:8000,on:true},{id:15,cat:"m",name:"عصير",price:6000,on:true},
{id:16,cat:"a",name:"جبنة بيضاء",price:30000,on:true},{id:17,cat:"a",name:"لبنة",price:18000,on:true},{id:18,cat:"a",name:"لبن 1 كغ",price:12000,on:true}];
var cart={},db=null,ref=null,authed=false,view="home",cur=null,pin="",addr="",msg="",last="",ask=null,loaded=false;
function fmt(n){return n.toLocaleString("ar-EG")+" ل.س"}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function cat(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[0]}
function cache(){try{localStorage.setItem("shop_items",JSON.stringify(items))}catch(e){}}
function save(){
 cache();msg="جاري الحفظ...";
 fetch(API,{method:"POST",body:JSON.stringify({pass:adminPass,items:items})}).then(function(r){return r.json()}).then(function(j){msg=j.ok?"تم الحفظ ✓":"تعذر الحفظ: كلمة السر غير صحيحة";draw()}).catch(function(){msg="تعذر الاتصال، لم يتم الحفظ";draw()});
}
function totals(){var t=0,c=0,l=[];items.forEach(function(i){var q=cart[i.id]||0;if(q&&!i.del){t+=q*i.price;c+=q;l.push(q+" × "+i.name)}});return{t:t,c:c,l:l}}
function row(i){
 var c=cat(i.cat),q=cart[i.id]||0;
 return '<div class="row"><div class="ic" style="background:linear-gradient(135deg,'+c.c+')">'+c.e+'</div><div class="n">'+esc(i.name)+'<div class="p">'+fmt(i.price)+'</div></div><div class="q">'+(q?'<button data-a="m" data-i="'+i.id+'">−</button><b>'+q+'</b>':'')+'<button class="pl" data-a="p" data-i="'+i.id+'">+</button></div></div>';
}
function home(){
 var h='<div class="hero"><h1>🛒 سوبرماركت الحي</h1><p>اختر القسم وأضف طلبك بضغطة</p></div><div class="grid">';
 CATS.forEach(function(c){
  var n=items.filter(function(i){return i.cat===c.id&&!i.del}).length;
  h+='<button class="cat" data-a="cat" data-i="'+c.id+'" style="background:linear-gradient(135deg,'+c.c+')"><span class="e">'+c.e+'</span>'+c.n+'<small>'+n+' منتج</small></button>';
 });
 return h+'</div><button class="lock" data-a="adm" aria-label="صاحب المحل">🔒</button>';
}
function catv(){
 var c=cat(cur),h='<div class="top"><button class="ib" data-a="home" aria-label="الرئيسية">🏠</button><h2>'+c.e+' '+c.n+'</h2></div>';
 var l=items.filter(function(i){return i.cat===cur&&!i.del});
 l.forEach(function(i){h+=row(i)});
 return h+(l.length?'':'<div class="empty">لا يوجد منتجات متوفرة بهذا القسم حالياً</div>');
}
function cartv(){
 var T=totals(),h='<div class="top"><button class="ib" data-a="home" aria-label="الرئيسية">🏠</button><h2>🧺 سلتي</h2></div>';
 if(!T.c)return h+'<div class="empty">السلة فارغة</div>';
 items.filter(function(i){return cart[i.id]&&!i.del}).forEach(function(i){h+=row(i)});
 h+='<div class="tot"><span>المجموع</span><span>'+fmt(T.t)+'</span></div><input id="addr" placeholder="📍 موقعك أو عنوانك" value="'+esc(addr)+'"><button class="main" data-a="send">إرسال الطلب عبر واتساب</button>';
 return h;
}
function login(){
 var d='';for(var k=0;k<PLEN;k++)d+='<i class="'+(k<pin.length?'f':'')+'"></i>';
 var h='<div class="top"><button class="ib" data-a="home" aria-label="رجوع">🏠</button><h2>🔐 صاحب المحل</h2></div><div class="dots" id="dots">'+d+'</div><div class="pad">';
 for(var n=1;n<=5;n++)h+='<button data-a="k" data-i="'+n+'">'+n+'</button>';
 return h+'<button data-a="kd">⌫</button></div>';
}
function admin(){
 var h='<div class="top"><button class="ib" data-a="out" aria-label="خروج">🚪</button><h2>⚙️ لوحة التحكم</h2></div><div class="note">قلّب المفتاح: متوفر أو لا · عدّل السعر · احذف · أضف</div>';
 CATS.forEach(function(c){
  h+='<div class="ch">'+c.e+' '+c.n+'</div>';
  items.filter(function(i){return i.cat===c.id&&!i.del}).forEach(function(i){
   h+='<div class="row"><div class="n">'+esc(i.name)+'</div><input style="width:92px" type="number" inputmode="numeric" value="'+i.price+'" data-pr="'+i.id+'"><button class="dl" data-a="d" data-i="'+i.id+'">🗑</button></div>';
  });
 });
 var dl=[];
 if(dl.length){h+='<div class="ch">🗑 المحذوفات</div>';dl.forEach(function(i){h+='<div class="row off"><div class="n">'+esc(i.name)+'</div><button class="main" style="width:auto;margin:0;padding:8px 14px;box-shadow:none" data-a="r" data-i="'+i.id+'">استرجاع</button><button class="dl" data-a="x" data-i="'+i.id+'">✖</button></div>'})}
 h+='<div class="ch">➕ إضافة منتج</div><select id="nc">'+CATS.map(function(c){return '<option value="'+c.id+'">'+c.n+'</option>'}).join('')+'</select><div style="display:flex;gap:8px;margin-top:8px"><input id="nn" placeholder="اسم المنتج" style="flex:2"><input id="np" type="number" inputmode="numeric" placeholder="السعر" style="flex:1"></div><button class="main" data-a="add">إضافة المنتج</button>';
 if(msg)h+='<div class="note">'+esc(msg)+'</div>';
 return h;
}
function draw(){if(!loaded){document.getElementById("app").innerHTML='<div class="empty" style="padding-top:40vh">جاري التحميل...</div>';return}
 if(location.hash==="#admin"&&view!=="admin")view=authed?"admin":"login";
 var app=document.getElementById("app"),h=view==="cat"?catv():view==="cart"?cartv():view==="login"?login():view==="admin"?admin():home();
 app.innerHTML=h;
 if(last!==view){window.scrollTo(0,0);last=view}
 var T=totals(),b=document.getElementById("bar");
 b.innerHTML=(T.c&&(view==="home"||view==="cat"))?'<button data-a="cart"><span>🧺 '+T.c+' قطعة</span><span>'+fmt(T.t)+' ← عرض السلة</span></button>':'';
 var a=document.getElementById("addr");if(a)a.oninput=function(){addr=a.value};
}
function go(v){view=v;if(v!=="login"&&v!=="admin"&&location.hash)history.replaceState(null,"",location.pathname+location.search);draw()}
function act(e){
 var t=e.target.closest("[data-a]");if(!t)return;
 var a=t.getAttribute("data-a"),id=t.getAttribute("data-i");
 if(a==="cat"){cur=id;go("cat")}
 else if(a==="home")go("home");
 else if(a==="cart")go("cart");
 else if(a==="p"){cart[id]=(cart[id]||0)+1;draw()}
 else if(a==="m"){cart[id]=Math.max(0,(cart[id]||0)-1);draw()}
 else if(a==="send"){var T=totals();var txt="طلب جديد:\n"+T.l.join("\n")+"\nالمجموع: "+fmt(T.t)+"\nالموقع: "+(addr||"غير محدد");var u="https://wa.me/"+WA+"?text="+encodeURIComponent(txt);var w=null;try{w=window.open(u,"_blank")}catch(x){}
  if(!w){waFallback(txt,u)}}
 else if(a==="adm"){pin="";view=authed?"admin":"login";draw()}
 else if(a==="k"){
  if(pin.length<PLEN)pin+=id;draw();
  if(pin.length===PLEN){var tp=pin;pin="";
   var bad=function(){setTimeout(function(){draw();var x=document.getElementById("dots");if(x)x.classList.add("shake")},150)};
   fetch(API,{method:"POST",body:JSON.stringify({action:"login",pass:tp})}).then(function(r){return r.json()}).then(function(j){if(j.ok){authed=true;adminPass=tp;view="admin";draw()}else bad()}).catch(bad);
  }
 }
 else if(a==="kd"){pin=pin.slice(0,-1);draw()}
 else if(a==="out"){authed=false;go("home")}
 else if(a==="t"){items.forEach(function(i){if(i.id==id)i.on=!i.on});save();draw()}
 else if(a==="d"){ask={t:"d",id:id};askUI("متأكد من حذف هذا المنتج؟",true)}
 else if(a==="no"){ask=null;var o1=document.getElementById("ov");if(o1)o1.remove()}
 else if(a==="yes"){var q=ask;ask=null;var o2=document.getElementById("ov");if(o2)o2.remove();
  if(q&&q.t==="d"){items=items.filter(function(i){return i.id!=q.id});msg="تم حذف المنتج";save()}
  else if(q&&q.t==="a"){items.push({id:Date.now(),cat:q.c,name:q.n,price:q.p,on:true});msg="تمت إضافة: "+q.n;save()}
  draw()}
 else if(a==="r"){items.forEach(function(i){if(i.id==id)i.del=false});save();draw()}
 else if(a==="x"){items=items.filter(function(i){return i.id!=id});save();draw()}
}
function waFallback(txt,u){
 var old=document.getElementById("ov");if(old)old.remove();
 var o=document.createElement("div");o.className="ov";o.id="ov";
 o.innerHTML='<div class="bx"><p>تعذّر فتح واتساب من هنا</p><textarea id="wt" readonly rows="6" style="width:100%;border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd)">'+esc(txt)+'</textarea><div class="note">انسخ الطلب وأرسله على الرقم 0949600493</div><a href="'+u+'" target="_blank" rel="noopener" style="display:block;margin:10px 0;color:var(--ac);font-weight:800">فتح واتساب</a><div class="yn"><button class="no" data-a="no">إغلاق</button></div></div>';
 document.body.appendChild(o);var t=document.getElementById("wt");t.focus();t.select();
}
function askUI(text,red){
 var old=document.getElementById("ov");if(old)old.remove();
 var o=document.createElement("div");o.className="ov";o.id="ov";
 o.innerHTML='<div class="bx"><p>'+esc(text)+'</p><div class="yn"><button class="y'+(red?' r':'')+'" data-a="yes">نعم</button><button class="no" data-a="no">لا</button></div></div>';
 document.body.appendChild(o);
}
function add(){
 var n=document.getElementById("nn").value.trim(),p=parseFloat(document.getElementById("np").value),c=document.getElementById("nc").value;
 if(!n||!p){msg="اكتب اسم المنتج والسعر";draw();return}
 ask={t:"a",c:c,n:n,p:p};askUI("إضافة المنتج: "+n+" بسعر "+fmt(p)+"؟");
}
var app=document.getElementById("app"),bar=document.getElementById("bar");
app.addEventListener("click",function(e){if(e.target.closest('[data-a="add"]'))return;act(e)});
bar.addEventListener("click",act);
document.body.addEventListener("click",function(e){if(e.target.closest("#ov"))act(e)});
app.addEventListener("pointerdown",function(e){if(e.target.closest('[data-a="add"]')){e.preventDefault();add()}});
app.addEventListener("change",function(e){
 var id=e.target.getAttribute("data-pr");
 if(id){items.forEach(function(i){if(i.id==id)i.price=parseFloat(e.target.value)||i.price});save();draw()}
});
window.addEventListener("error",function(e){var b=document.getElementById("eb");if(!b){b=document.createElement("div");b.id="eb";b.style.cssText="position:fixed;top:0;left:0;right:0;background:#d64545;color:#fff;padding:8px 12px;z-index:99;font-size:13px;direction:ltr";document.body.appendChild(b)}b.textContent=String(e.message)});
window.addEventListener("hashchange",function(){if(location.hash!=="#admin"&&(view==="admin"||view==="login"))view="home";draw()});
draw();
try{var c=localStorage.getItem("shop_items");if(c){items=JSON.parse(c);loaded=true}}catch(e){}
fetch(API).then(function(r){return r.json()}).then(function(j){
 if(j&&j.ok&&j.init){items=j.items;cache()}
 loaded=true;var a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="SELECT")))draw()
}).catch(function(){loaded=true;draw()});
</script>
</body>
</html>
